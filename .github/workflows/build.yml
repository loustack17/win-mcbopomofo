name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -S . -A x64

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content build/generated/version.json -Raw | ConvertFrom-Json
          "version=$($metadata.version)" >> $env:GITHUB_OUTPUT

      - name: Build
        run: cmake --build build --config Debug

      - name: Install OpenCppCoverage
        run: |
          choco install opencppcoverage -y
          echo "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

      - name: Run Tests with Code Coverage
        run: |
          OpenCppCoverage.exe --sources src --export_type cobertura:coverage.xml --cover_children -- ctest.exe --test-dir build -C Debug --output-on-failure

      - name: Upload Coverage to Codecov
        if: github.event_name != 'workflow_dispatch'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install WiX Toolset
        run: |
          winget install --id WiXToolset.WiXCLI --accept-package-agreements --accept-source-agreements
          $env:Path += ";C:\Program Files\WiX Toolset v7.0\bin"
          wix eula accept wix7

      - name: Build MSI Installer
        run: .\build_msi.ps1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Win-McBopomofo-${{ steps.version.outputs.version }}
          path: dist/Win-McBopomofo-${{ steps.version.outputs.version }}-Installer.msi
          if-no-files-found: error
